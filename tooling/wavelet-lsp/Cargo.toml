[workspace]

[package]
name = "wavelet-lsp"
version = "0.12.0"
edition = "2024"
description = "A basic Language Server for the Wavelet language"

[[bin]]
name = "wavelet-lsp"
path = "src/main.rs"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.94"
serde = "1"
serde_json = "1"
wavelet = { path = "../.." }
