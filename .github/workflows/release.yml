name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/check.yml

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v5
        if: runner.os != 'Windows'

      - name: Extract Windows build sources
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/tarball/$GITHUB_SHA" |
            tar -xz --exclude='*/.lot-vault' --strip-components=1

      - uses: dtolnay/rust-toolchain@stable

      - name: Build and stage wavelet (CLI)
        shell: bash
        run: scripts/ci/build-cli.sh ${{ matrix.target }}

      - name: Build and stage wavelet-lsp
        shell: bash
        run: scripts/ci/build-lsp.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: bins-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bins-*
          path: staged-bins
          merge-multiple: true

      - name: Package editor tooling, collect binaries, bundle tarballs
        run: scripts/ci/package-tooling.sh
        env:
          STAGED_BINS: staged-bins

      - name: Extract changelog section for ${{ github.ref_name }}
        run: scripts/ci/changelog-section.sh "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/wavelet-*
          fail_on_unmatched_files: true
          body_path: release-notes.md
          generate_release_notes: true
