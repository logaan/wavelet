name: Check
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-wasip1
      - run: python3 scripts/check-quality.py
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: wasm-tools@1.263.0,wasmtime@50.0.1,cargo-llvm-cov@0.9.1
          fallback: none
      - name: Install wac and wkg
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSL --retry 3 -o wac https://github.com/bytecodealliance/wac/releases/download/v0.12.0/wac-cli-x86_64-unknown-linux-musl
          curl -fsSL --retry 3 -o wkg https://github.com/bytecodealliance/wasm-pkg-tools/releases/download/v0.16.1/wkg-x86_64-unknown-linux-gnu
          sha256sum --check <<'CHECKSUMS'
          7cd490edbd452221ef89e6750fc43eacc9b71b1242095eb577cb9a3bf0d3beda  wac
          235ecf455e11b8b146e00f24f24c95b573cfe6a432f332358463b229311cec57  wkg
          CHECKSUMS
          install -m 0755 wac wkg "$HOME/.cargo/bin"
      - run: cargo install --locked cargo-component --version 0.21.1
      - run: WAVELET_REQUIRE_HOST_TOOLS=1 scripts/coverage.sh --check
      - run: cargo build
      - run: WAVELET="$PWD/target/debug/wavelet" conformance/wavelet/test-matrix.sh
      - run: cargo clippy --manifest-path tooling/wavelet-lsp/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path tooling/wavelet-lsp/Cargo.toml
  editor-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            tooling/vscode/package-lock.json
            docs/package-lock.json
            tooling/quality/package-lock.json
      - run: python3 scripts/check-duplication.py
      - run: npm ci --prefix tooling/vscode
      - run: npm --prefix tooling/vscode run check
      - run: scripts/ci/build-docs.sh
  history-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m unittest discover -s scripts/tests -p test_code_maat.py
      - run: python3 scripts/code-maat.py
      - uses: actions/upload-artifact@v4
        with:
          name: code-maat-history
          path: target/code-maat/reports/
          if-no-files-found: error
