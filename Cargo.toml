[package]
name = "wavelet"
version = "0.12.1"
edition = "2024"
license = "MIT"

[lib]

crate-type = ["cdylib", "rlib"]

[features]

default = ["playground"]
playground = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies]
wac-graph = "0.10.0"
sha2 = "0.10"
wat = "1"
wasm-encoder = "0.251.0"
wit-component = "0.251.0"
wit-parser = { version = "0.251.0", features = ["wat"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "50", default-features = false, features = ["runtime", "cranelift", "component-model"] }

rustyline = "14"
tempfile = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[dev-dependencies]

serde_json = "1"
wasm-wave = "0.251.0"
