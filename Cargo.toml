[package]
name = "wavelet"
version = "0.12.1"
edition = "2024"
license = "Apache-2.0"

[lib]

crate-type = ["cdylib", "rlib"]

[dependencies]
wac-graph = "0.10.0"
sha2 = "0.10"
wat = "1"
wasm-encoder = { version = "0.251.0", features = ["wasmparser"] }
wasmparser = "0.251.0"
wit-component = "0.251.0"
wit-parser = { version = "0.251.0", features = ["wat"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wasmtime = { version = "50", default-features = false, features = ["runtime", "cranelift", "component-model"] }

rustyline = "14"
tempfile = "3"

[dev-dependencies]

serde_json = "1"
wasm-wave = "0.251.0"
